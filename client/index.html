<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phan Tấn Phú | Full-Stack Software Engineer Portfolio</title>
    <meta name="description" content="Portfolio of Phan Tan Phu - Full-Stack Developer specializing in React, .NET Core, Node.js, and Enterprise Systems." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN with configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                900: '#312e81',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Dark mode styles */
      html.dark body {
        background-color: #0a0d14;
        color: #f8fafc;
      }
      html.dark ::-webkit-scrollbar-track {
        background: #0a0d14;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #1f2b45;
      }
      html.dark .glass-card {
        background: rgba(22, 30, 49, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      html.dark .glass-card:hover {
        border-color: rgba(99, 102, 241, 0.4);
      }
      html.dark .gradient-glow {
        background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, rgba(10, 13, 20, 0) 70%);
      }

      /* Light mode styles */
      html:not(.dark) body {
        background-color: #f8fafc;
        color: #0f172a;
      }
      html:not(.dark) ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      html:not(.dark) ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
      }
      html:not(.dark) .glass-card {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(226, 232, 240, 0.9);
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      }
      html:not(.dark) .glass-card:hover {
        border-color: rgba(99, 102, 241, 0.5);
        box-shadow: 0 10px 25px -3px rgba(99, 102, 241, 0.1);
      }
      html:not(.dark) .gradient-glow {
        background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, rgba(248, 250, 252, 0) 70%);
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6366f1;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
